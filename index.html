<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WormGPT - Unrestricted</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- Top Bar (Minimal) -->
        <div class="top-bar">
            <div class="logo">WormGPT</div>
            <button class="menu-btn" id="menu-btn">☰</button>
        </div>

        <!-- History Sidebar (Hidden by Default) -->
        <div class="history-sidebar" id="history-sidebar">
            <div class="history-header">
                <h3>History</h3>
                <button class="close-history" id="close-history">×</button>
            </div>
            <div class="history-list" id="history-list"></div>
        </div>

        <!-- Chat Area (Centered) -->
        <div class="chat-area" id="chat-area">
            <div class="messages" id="messages"></div>
        </div>

        <!-- Input Area (Bottom) -->
        <div class="input-area">
            <div class="input-wrapper">
                <label class="file-upload">
                    <input type="file" id="file-upload" multiple>
                    <span>📁</span>
                </label>
                <textarea id="user-input" placeholder="Ask anything... (No limits)"></textarea>
                <button id="send-btn">→</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
