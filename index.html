<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WormGPT Zero-Limit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm.js@5.1.0/css/xterm.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm.js@5.1.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="new-chat-btn">
                    <span class="icon">+</span> New Chat
                </button>
                <button id="theme-toggle" class="theme-toggle">
                    <span class="icon">🌙</span>
                </button>
            </div>
            <div class="conversation-list" id="conversation-list"></div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <div class="chat-header">
                <h1>WormGPT Zero-Limit</h1>
                <div class="tabs">
                    <button class="tab active" data-tab="chat">Chat</button>
                    <button class="tab" data-tab="editor">File Editor</button>
                    <button class="tab" data-tab="terminal">Terminal</button>
                </div>
            </div>

            <!-- Chat Tab -->
            <div class="chat-container tab-content active" id="chat-tab">
                <div class="messages" id="messages"></div>
                <div class="input-area">
                    <textarea id="user-input" placeholder="Ask anything... (No limits)"></textarea>
                    <button id="send-btn" class="send-btn">
                        <span class="icon">→</span>
                    </button>
                </div>
            </div>

            <!-- File Editor Tab -->
            <div class="editor-container tab-content" id="editor-tab">
                <div class="editor-header">
                    <input type="text" id="file-name" placeholder="filename.py" class="file-name-input">
                    <button id="save-file-btn" class="save-btn">Save File</button>
                </div>
                <div class="editor" id="editor"></div>
            </div>

            <!-- Terminal Tab -->
            <div class="terminal-container tab-content" id="terminal-tab">
                <div id="terminal"></div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
